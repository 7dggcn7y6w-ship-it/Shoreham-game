ble=true;driving=false;speed=0}else if(person.position.distanceTo(vehicle.position)<7){driving=true;person.visible=false;heading=vehicle.rotation.y}else{msg.textContent='Walk closer to your blue car.';return}document.querySelector('#enter').textContent=driving?'Exit car':'Enter car'};document.querySelector('#job').onclick=()=>{let t=targets[Math.floor(rand()*targets.length)];marker.position.set(t[0],.25,t[1]);job=true;msg.textContent='Reach the yellow ring to earn £250.'};document.querySelector('#reset').onclick=()=>{vehicle.position.set(-2,0,5);person.position.set(2,0,5);vehicle.rotation.y=heading=speed=0;driving=false;person.visible=true;document.querySelector('#enter').textContent='Enter car'};let clock=new T.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(.05,clock.getDelta()),o=driving?vehicle:person;heading+=((keys.left?1:0)-(keys.right?1:0))*dt*(driving?1.5:2.5);o.rotation.y=heading;let goal=(keys.up?1:keys.down?-0.45:0)*(driving?24:4);speed+=(goal-speed)*Math.min(1,dt*(driving?2:10));let p=o.position.clone().add(new T.Vector3(-Math.sin(heading)*speed*dt,0,-Math.cos(heading)*speed*dt));if(clear(p))o.position.copy(p);else speed=0;if(!driving)legs.forEach((l,i)=>l.rotation.x=Math.sin(performance.now()*.012+i*Math.PI)*Math.min(1,Math.abs(speed)/4)*.6);let offset=new T.Vector3(Math.sin(heading)*(driving?10:6),driving?5:3.5,Math.cos(heading)*(driving?10:6));camera.position.lerp(o.position.clone().add(offset),.13);camera.lookAt(o.position.clone().add(new T.Vector3(0,1.2,0)));if(job&&o.position.distanceTo(marker.position)<3){cash+=250;job=false;msg.textContent='Delivery complete! £250 earned.'}marker.visible=job;status.textContent='£'+cash+' | '+(driving?Math.round(Math.abs(speed)*2.237)+' mph':'On foot')+' | '+(o.position.z>90?'Shoreham Beach':o.position.z>50?'River Adur':'Shoreham town')+(job?' | Job '+Math.round(o.position.distanceTo(marker.position))+' m':'');renderer.render(scene,camera)}onresize=()=>{camera.aspect=innerWidth/innerHeight;c
